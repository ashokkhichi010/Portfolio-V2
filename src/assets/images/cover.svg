<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="60%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0c1128"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="400" height="550" fill="url(#coverGrad)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="275" rx="200" ry="270" fill="url(#glow)"/>

  <!-- Spine shimmer on right edge -->
  <rect x="380" y="0" width="20" height="550" fill="url(#spineGrad)" opacity="0.6"/>

  <!-- Outer decorative border -->
  <rect x="16" y="16" width="368" height="518" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.35" rx="3"/>
  <rect x="22" y="22" width="356" height="506" fill="none" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.2" rx="2"/>

  <!-- Corner ornaments - top left -->
  <g stroke="#c084fc" stroke-opacity="0.5" fill="none" stroke-width="0.8">
    <path d="M16,50 L16,16 L50,16"/>
    <path d="M26,50 L26,26 L50,26"/>
    <circle cx="16" cy="16" r="3" fill="#c084fc" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Corner ornaments - top right -->
  <g stroke="#c084fc" stroke-opacity="0.5" fill="none" stroke-width="0.8">
    <path d="M384,50 L384,16 L350,16"/>
    <path d="M374,50 L374,26 L350,26"/>
    <circle cx="384" cy="16" r="3" fill="#c084fc" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Corner ornaments - bottom left -->
  <g stroke="#c084fc" stroke-opacity="0.5" fill="none" stroke-width="0.8">
    <path d="M16,500 L16,534 L50,534"/>
    <path d="M26,500 L26,524 L50,524"/>
    <circle cx="16" cy="534" r="3" fill="#c084fc" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Corner ornaments - bottom right -->
  <g stroke="#c084fc" stroke-opacity="0.5" fill="none" stroke-width="0.8">
    <path d="M384,500 L384,534 L350,534"/>
    <path d="M374,500 L374,524 L350,524"/>
    <circle cx="384" cy="534" r="3" fill="#c084fc" fill-opacity="0.5" stroke="none"/>
  </g>

  <!-- Horizontal dividers near title area -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="#a78bfa" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="60" y1="370" x2="340" y2="370" stroke="#a78bfa" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Central floral/star ornament -->
  <g transform="translate(200, 145)" stroke="#c084fc" stroke-opacity="0.45" fill="none" stroke-width="0.7">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-28" y1="0" x2="28" y2="0"/>
    <line x1="-20" y1="-20" x2="20" y2="20"/>
    <line x1="20" y1="-20" x2="-20" y2="20"/>
    <circle cx="0" cy="0" r="12" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#c084fc" fill-opacity="0.25" stroke="none"/>
  </g>

  <!-- Small diamond ornament center bottom of title area -->
  <g transform="translate(200, 385)" fill="#a78bfa" fill-opacity="0.4">
    <polygon points="0,-6 5,0 0,6 -5,0"/>
  </g>

  <!-- Decorative side lines -->
  <line x1="36" y1="80" x2="36" y2="470" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="364" y1="80" x2="364" y2="470" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Subtle star field -->
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="50" cy="90" r="1"/>
    <circle cx="340" cy="120" r="1.2"/>
    <circle cx="80" cy="450" r="0.8"/>
    <circle cx="350" cy="430" r="1"/>
    <circle cx="100" cy="200" r="0.6"/>
    <circle cx="320" cy="320" r="0.8"/>
    <circle cx="60" cy="300" r="0.6"/>
    <circle cx="330" cy="240" r="1"/>
    <circle cx="180" cy="70" r="0.8"/>
    <circle cx="220" cy="490" r="0.6"/>
  </g>
</svg>
